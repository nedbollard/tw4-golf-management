name: View Guard

on:
  push:
    branches:
      - "**"
  pull_request:

jobs:
  verify-rendered-views:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install ripgrep
        run: sudo apt-get install -y ripgrep

      - name: Run source-level view guard
        run: ./scripts/verify-rendered-views.sh

      - name: Build app image for image-level guard
        run: docker build -t tw4-view-guard:${{ github.sha }} .

      - name: Run image-level view guard
        run: ./scripts/verify-rendered-views.sh --check-image tw4-view-guard:${{ github.sha }}
