services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${E2E_APP_PORT:-8086}:80"
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: TW4_base
      DB_USER: root
      DB_PASSWORD: ${E2E_DB_PASSWORD:-tw4_e2e_password}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - tw4-e2e-network

  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${E2E_DB_PASSWORD:-tw4_e2e_password}
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 2s
      timeout: 5s
      retries: 60
    volumes:
      - ./database/baseline/TW4_base_schema.sql:/docker-entrypoint-initdb.d/01-base-schema.sql:ro
      - ./database/baseline/TW4_live_schema.sql:/docker-entrypoint-initdb.d/02-live-schema.sql:ro
      - ./database/baseline/TW4_history_schema.sql:/docker-entrypoint-initdb.d/03-history-schema.sql:ro
      - ./database/baseline/TW4_holding_schema.sql:/docker-entrypoint-initdb.d/04-holding-schema.sql:ro
      - ./tests/fixtures/card-entry-e2e.sql:/docker-entrypoint-initdb.d/05-card-entry-fixture.sql:ro
      - ./tests/fixtures/e2e-apply-migrations.sh:/docker-entrypoint-initdb.d/06-apply-migrations.sh:ro
      - ./src/migrations:/migrations:ro
    networks:
      - tw4-e2e-network

networks:
  tw4-e2e-network:
    driver: bridge
