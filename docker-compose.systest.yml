services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-TW4_base}
      DB_USER: ${DB_USER:-root}
      DB_PASSWORD: ${DB_PASSWORD}
      DEBUG: ${DEBUG:-false}
    depends_on:
      - db
    volumes:
      - tw4_reports:/var/www/html/public/reports
      - tw4_sessions:/tmp
    networks:
      - tw4-network

  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:-TW4_base}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
    volumes:
      - tw4_data:/var/lib/mysql
    networks:
      - tw4-network

  phpmyadmin:
    image: phpmyadmin:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:8085:80"
    environment:
      PMA_HOST: db
      PMA_USER: root
      PMA_PASSWORD: ${DB_PASSWORD}
      PMA_ARBITRARY: 0
    depends_on:
      - db
    networks:
      - tw4-network

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - app
    environment:
      CADDY_DOMAIN: ${CADDY_DOMAIN:-localhost}
      CADDY_EMAIL: ${CADDY_EMAIL:-noreply@example.invalid}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - tw4-network

volumes:
  tw4_data:
  tw4_reports:
  tw4_sessions:
  caddy_data:
  caddy_config:

networks:
  tw4-network:
    driver: bridge