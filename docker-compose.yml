services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    user: "33:33"   # www-data in the php:apache image
    security_opt:
      - no-new-privileges:true
    ports:
      - "127.0.0.1:8084:80"
    volumes:
      - .:/var/www/html
      - tw4_reports:/var/www/html/public/reports   # Isolate generated reports from the repo bind mount
      - tw4_sessions:/tmp   # Added persistent volume for PHP sessions
    depends_on:
      db:
        condition: service_healthy
    networks:
      - tw4-network
    environment:
      DB_HOST: db
      DB_NAME: TW4_base
      DB_USER: root
      DB_PASSWORD: ${DB_PASSWORD}
      AUTOMATION_TOKEN: tw4_automation_dev_12345

  db:
    image: mysql:8.0.40
    user: "999:999"   # mysql user in the official MySQL image
    security_opt:
      - no-new-privileges:true
    restart: always
    environment:        
      MYSQL_DATABASE: TW4_base
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 2s
      timeout: 5s
      retries: 60
      start_period: 15s
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - tw4_data:/var/lib/mysql
    networks:
      - tw4-network

  phpmyadmin:
    image: phpmyadmin:5.2.2
    user: "33:33"   # www-data in the phpMyAdmin image
    security_opt:
      - no-new-privileges:true
    restart: always
    ports:
      - "127.0.0.1:8085:80"
    environment:
      PMA_HOST: db
      PMA_USER: root
      PMA_PASSWORD: ${DB_PASSWORD}
      PMA_ARBITRARY: 1
    depends_on:
      - db
    networks:
      - tw4-network

volumes:
  tw4_data:
  tw4_reports:    # Generated report output, isolated from the repo bind mount
  tw4_sessions:   # New volume for session storage

networks:
  tw4-network:
    driver: bridge
